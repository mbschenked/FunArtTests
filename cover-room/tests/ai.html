<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cover Room: AI scenarios</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/hud/hud.css">
<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "lil-gui":       "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  }
}
</script>
<style>
  :root { --ink: rgba(228, 232, 238, 0.93); --ink-dim: rgba(150, 164, 184, 0.88); --accent: #ffb454;
          --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06080c; color: var(--ink); font: 11px/1.4 var(--mono); }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #head { position: fixed; left: 10px; top: 10px; z-index: 16; max-width: 560px; padding: 7px 10px;
          background: rgba(8, 10, 14, 0.82); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; }
  #head h1 { margin: 0 0 3px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
  #head .sub { color: var(--ink-dim); }
  #fallback { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px;
              text-align: center; color: var(--ink-dim); background: #06080c; white-space: pre-line; }
  #fallback[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="gl" role="img" aria-label="AI scenario: enemies, posts and the debug overlay in a test courtyard"></canvas>
<div id="head"><h1>AI scenario</h1><div class="sub" id="title">loading</div>
  <div class="sub">?scenario=notice | camp | flank | lost &middot; ?room=real&amp;scenario=free &middot; F2 debug overlay &middot; ?test = stepped by tools/play.mjs</div></div>
<div id="fallback" role="status">Loading Three.js r160 from cdn.jsdelivr.net.</div>
<script>
(function () {
  var shown = false;
  function show(kind, detail) {
    var el = document.getElementById('fallback');
    if (shown || !el) return; shown = true; el.hidden = false; el.setAttribute('role', 'alert');
    el.textContent = 'The AI test stopped on an uncaught ' + kind + '.\n' + detail;
  }
  window.addEventListener('error', function (e) {
    if (/ResizeObserver loop/.test(String(e.message))) return;
    var err = e.error; show('error', err && err.stack ? err.stack : String(e.message));
  });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('promise rejection', r && r.stack ? r.stack : String(r)); });
})();
</script>
<script type="module">
import { runTestbed } from '../src/ai/testbed.js';
const q = new URLSearchParams(location.search);
await runTestbed({ canvas: document.getElementById('gl'), query: q });
document.getElementById('fallback').hidden = true;
</script>
</body>
</html>
